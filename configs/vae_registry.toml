[vae.hunyuan]
directory = "checkpoints/vae/hunyuan"
adapter = "diffusers_autoencoder_kl_hunyuan_video"
# NOT safetensors. Repo ships .pt only; registry must name it explicitly.
checkpoint = "pytorch_model.pt"
config = "config.json"
hf_repo = "tencent/HunyuanVideo"
hf_revision = "6204ad6aea1a77ff5aba337c88278bb9500eb37d"
hf_subfolder = "hunyuan-video-t2v-720p/vae"
sha256 = "95d1fc707c1421ccd88ea542838ab4c5d45a5babb48205bac9ce0985525f9818"
latent_channels = 16
spatial_multiple = 32
temporal_compression = 4
temporal = true
reconstruction_method = "supported_single_frame"
license = "Tencent custom"
gated = false
# config declares the deprecated AutoencoderKLCausal3D, which diffusers 0.40.0
# does not export. Must be mapped to AutoencoderKLHunyuanVideo at load.
deprecated_class = "AutoencoderKLCausal3D"
enabled = true

[vae.ltx]
