[vae.minimax_h3_image]
directory = "checkpoints/vae/minimax_h3_image"
adapter = "diffusers_autoencoder_kl_minimax_h3"
# Sharded: all three shards plus the index are one logical checkpoint.
# checkpoint names the index (the sentinel HF/diffusers resolve for sharded
# checkpoints); sha256 is empty because docs verify per-shard hashes only.
checkpoint = "diffusion_pytorch_model.safetensors.index.json"
checkpoint_is_sharded = true
checkpoint_shards = [
    "diffusion_pytorch_model-00001-of-00003.safetensors",
    "diffusion_pytorch_model-00002-of-00003.safetensors",
    "diffusion_pytorch_model-00003-of-00003.safetensors",
]
sha256 = ""
config = "config.json"
hf_repo = "MiniMaxAI/MiniMax-H3"
hf_revision = "42ed227ee7df40d41602854ae760620d6eb651fe"
hf_subfolder = "vae"
latent_channels = 24
spatial_multiple = 16
temporal_compression = 4
temporal = true
reconstruction_method = "unsupported"
unsupported_reason = "config declares clip_length=17 (trained on 17-frame clips); T=1 is outside the documented regime and no single-frame path is documented"
license = "MiniMax H3 Community License"
gated = false
enabled = false
