[project]
name = "image-humanizer"
version = "0.1.0"
description = "Learn to invert VAE reconstruction artifacts (watermarks) in pixel space"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2.0",
    "pillow>=11.0",
    "safetensors>=0.5",
    "diffusers>=0.33",
    "transformers>=4.49",
    "accelerate>=1.4",
    "tqdm>=4.67",
]

[project.scripts]
image-humanizer = "image_humanizer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_humanizer"]

[tool.uv]
index-url = "https://pypi.org/simple"
